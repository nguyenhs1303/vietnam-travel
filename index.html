<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bản đồ danh lam thắng cảnh Việt Nam</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇻🇳</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600;800&display=swap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <!-- Giao diện: nạp đúng thứ tự này (file sau ghi đè file trước).
       ?v=…: mã phiên bản — ĐỔI mỗi lần sửa CSS/JS/data (cùng một giá trị cho mọi file) để Safari / trình duyệt không dùng
       bản cũ đã lưu đệm (GitHub Pages cho lưu 10 phút, Safari có khi lâu hơn). tests/mobile.spec.js kiểm tra. -->
  <link rel="stylesheet" href="css/base.css?v=2026-11-27b">
  <link rel="stylesheet" href="css/best-now.css?v=2026-11-27b">
  <link rel="stylesheet" href="css/map.css?v=2026-11-27b">
  <link rel="stylesheet" href="css/popup.css?v=2026-11-27b">
  <link rel="stylesheet" href="css/season-bar.css?v=2026-11-27b">
  <link rel="stylesheet" href="css/theme.css?v=2026-11-27b">
  <link rel="stylesheet" href="css/night.css?v=2026-11-27b">
  <link rel="stylesheet" href="css/timeline.css?v=2026-11-27b">
  <link rel="stylesheet" href="css/intro.css?v=2026-11-27b">
  <link rel="stylesheet" href="css/responsive.css?v=2026-11-27b">
</head>
<body>
  <!-- Mẫu gạch chéo cho nước láng giềng (bản đồ ngày / đêm) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="7" height="7" fill="#eadfc4"/>
        <line x1="0" y1="0" x2="0" y2="7" stroke="#b8a27a" stroke-width="0.9" opacity=".55"/>
      </pattern>
      <!-- Gạch chéo cho bản đồ đêm -->
      <pattern id="hatch-night" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="7" height="7" fill="#17283f"/>
        <line x1="0" y1="0" x2="0" y2="7" stroke="#34507a" stroke-width="0.9" opacity=".7"/>
      </pattern>
    </defs>
  </svg>
  <!-- Lối tắt cho bàn phím: chỉ hiện khi được focus (Tab đầu tiên) -->
  <nav class="skip-links" aria-label="Lối tắt">
    <a href="#list" data-skip="list">Tới danh sách địa danh</a>
    <a href="#map" data-skip="map">Tới bản đồ</a>
    <a href="#map" data-skip="bar">Tới thanh chọn tháng / dòng thời gian</a>
  </nav>
  <!-- Thông báo cho trình đọc màn hình (số kết quả, tháng đang chọn, thời tiết…) — ẩn khỏi mắt -->
  <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
  <aside id="sidebar">
    <header>
      <h1>Khám phá Việt Nam</h1>
      <label for="search" class="search-label">Tìm địa điểm, tỉnh hoặc món ăn</label>
      <input id="search" type="search" placeholder="Tìm: phở, Huế, Hạ Long…">
      <div id="filters"></div>
      <!-- Top 3 nơi nên đi lúc này (chấm theo mùa + dự báo 3 ngày) -->
      <details id="best-now" open>
        <summary><span aria-hidden="true">✨</span> Đẹp nhất lúc này</summary>
        <div class="best-body"><p class="best-wait"><span aria-hidden="true">⏳</span> Đang tính…</p></div>
      </details>
    </header>
    <ul id="list" aria-label="Danh sách địa danh"></ul>
  </aside>
  <main id="map" aria-label="Bản đồ danh thắng"></main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <!-- Dữ liệu -->
  <script src="data/data.js?v=2026-11-27b"></script>
  <script src="data/photo-credits.js?v=2026-11-27b"></script>
  <script src="data/vietnam-border.js?v=2026-11-27b"></script>
  <script src="data/paper-data.js?v=2026-11-27b"></script>
  <!-- Mã: các file dùng chung biến toàn cục nên phải nạp đúng thứ tự (xem README.md) -->
  <script src="js/map.js?v=2026-11-27b"></script>
  <script src="js/map-controls.js?v=2026-11-27b"></script>
  <script src="js/theme.js?v=2026-11-27b"></script>
  <script src="js/places.js?v=2026-11-27b"></script>
  <script src="js/weather.js?v=2026-11-27b"></script>
  <script src="js/best-now.js?v=2026-11-27b"></script>
  <script src="js/popup.js?v=2026-11-27b"></script>
  <script src="js/markers.js?v=2026-11-27b"></script>
  <script src="js/declutter.js?v=2026-11-27b"></script>
  <script src="js/season.js?v=2026-11-27b"></script>
  <script src="js/timeline.js?v=2026-11-27b"></script>
  <script src="js/list.js?v=2026-11-27b"></script>
  <script src="js/intro.js?v=2026-11-27b"></script>
  <script src="js/main.js?v=2026-11-27b"></script>
</body>
</html>
